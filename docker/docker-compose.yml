services:
  middleman:
    container_name: middleman
    build:
      context: ./middleman
      dockerfile: Dockerfile
    tty: true
    stdin_open: true
    networks:
      malcolm:
        ipv4_address: 192.168.1.2
    cap_add:
      - NET_RAW
      - NET_ADMIN
  victim:
    container_name: victim
    build:
      context: ./victim
      dockerfile: Dockerfile
    tty: true
    stdin_open: true
    networks:
      malcolm:
        ipv4_address: 192.168.1.3
    cap_add:
      - NET_RAW
      - NET_ADMIN
  victim_target:
    container_name: victim_target
    build: 
      context: ./victim_target
      dockerfile: Dockerfile
    tty: true
    stdin_open: true
    networks:
      malcolm:
        ipv4_address: 192.168.1.4
    cap_add:
      - NET_RAW
      - NET_ADMIN
networks:
  malcolm:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.1.0/24

